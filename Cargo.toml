[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cantmediaus-design/OpenPax"

[workspace.dependencies]
openpax-core = { path = "crates/openpax-core" }
openpax-paint = { path = "crates/openpax-paint" }
openpax-model = { path = "crates/openpax-model" }
openpax-render = { path = "crates/openpax-render" }
openpax-script = { path = "crates/openpax-script" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp", "tga", "jpeg"] }
png = "0.18"
clap = { version = "4", features = ["derive"] }
rhai = { version = "1", features = ["sync"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "json"] }
sha1_smol = "1"
glam = "0.34"
wgpu = "30"

eframe = { version = "0.37", features = ["persistence"] }
egui_dock = "0.22"
rfd = "0.18"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
