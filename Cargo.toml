[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openpax/openpax"

[workspace.dependencies]
openpax-core = { path = "crates/openpax-core" }
openpax-paint = { path = "crates/openpax-paint" }
openpax-model = { path = "crates/openpax-model" }
openpax-render = { path = "crates/openpax-render" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
glam = "0.34"
wgpu = "30"

eframe = { version = "0.37", features = ["persistence"] }
egui_dock = "0.22"
rfd = "0.18"
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
